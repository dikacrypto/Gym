<div class="card"><h3>2. Rep & beban</h3><p class="m"><b>Riset:</b> Schoenfeld dkk. (2017, 21 studi): beban ringan (&gt;15 rep) dan berat (&lt;15 rep) memberi hipertrofi serupa bila set dekat gagal otot; beban berat unggul untuk kekuatan maksimal. Karena itu compound 6–12 rep, isolasi kecil (lateral raise, rear delt) 12–20 rep. Tag <b>RIR</b> = rep cadangan; set utama dilakukan dekat gagal dengan teknik bersih.</p></div>
<div class="card"><h3>3. Plate hanya kelipatan 5 kg: kapan naik?</h3><p class="m"><b>Praktik coach (double progression):</b> naikkan rep dulu dalam rentang, baru tambah beban. Yang menentukan strategi adalah <i>persen lompatan</i> = kenaikan terkecil ÷ beban sekarang (konsep ini dipakai aplikasi progresi seperti Alpha Progression).<br><br>• <b>≤12%</b> (mis. +5 kg di ≥42 kg): semua set capai batas atas rep → langsung naik.<br>• <b>12–25%</b> (mis. triceps 30→35 kg = 17%): batas atas harus tercapai <b>2 sesi berturut-turut</b>, baru naik. Setelah naik, rep turun ±3–5 dan dibangun lagi 2–3 minggu. Bila rep belum pulih ke ≥10 setelah 3 minggu: kembali ke beban lama + tambah 1 set.<br>• <b>&gt;25%</b> (mis. lateral raise 10→15 kg = 50%): jangan lompat. Naikkan rep sampai 20–25, perlambat tempo turun (3 dtk), atau tambah 1 set. Naik beban hanya bila 25 rep tercapai di semua set; bila dumbbell berselisih 1–2 kg, pakai itu.<br><br>Otot kecil (bahu samping, triceps, bisep) memang naik beban jauh lebih lambat daripada compound. Itu normal; progresnya terbaca dari rep, set, dan volume total, bukan hanya angka kg.</p></div>
<div class="card"><h3>Target coach otomatis tiap sesi</h3><p class="m">Setiap latihan punya baris <b>🎯 Target coach</b>: beban, jumlah set, rep per set, dan RIR per set. Coach menghitungnya dari sesi terakhir latihan itu (beban, rep tiap set, RIR): <b>naik</b> (+beban, rep mulai dari bawah), <b>konfirmasi</b> (ulang beban yang sama), <b>tahan</b> (+1 rep tiap set), <b>kelelahan</b> (rep sama, istirahat +45 dtk), <b>turun</b>, atau <b>+1 set</b> bila stagnan 3 sesi. Angka target otomatis terisi saat set dicentang. Sesi pertama memakai estimasi awal dari berat badan. Ini aturan praktik coach (heuristik); sesuaikan dengan kondisimu, terutama bila teknik mulai goyah.</p></div><div class="card"><h3>Aturan naik beban: rep boleh turun antar set</h3><p class="m">Dengan beban sama, kelelahan menumpuk, jadi rep wajar turun dari set ke set (misal 12-10-9-8). Coach menyuruh naik bila <b>set 1 mencapai batas atas</b> dan <b>set terakhir masih di dalam rentang rep</b>. Bila set terakhir jatuh di bawah batas bawah: perpanjang istirahat dulu. Catat <b>RIR</b> tiap set (rep cadangan): rata-rata ≥4 berarti terlalu ringan; ≤target−2 berarti terlalu dekat gagal. Ini aturan praktik coach (heuristik), bukan hasil satu studi.</p></div><div class="card"><h3>Contoh milikmu</h3><p class="m"><b>Triceps pushdown 30 kg:</b> 3×10–15. Saat 3×15 dua sesi berturut-turut → 35 kg, rep turun ke 8–10, bangun lagi ke 15 dalam 2–3 minggu. <b>Lateral raise 10–12 kg:</b> 3–4×12–20, tambah rep sampai 20, lalu +1–2 kg bila ada; bila tidak, tambah set atau perlambat tempo.</p></div>
<div class="card"><h3>Batas kejujuran</h3><p class="m">Skor rapor, rentang 0.1–0.6%/minggu untuk berat badan, dan rumus beban awal adalah heuristik aplikasi, bukan standar dari satu studi. Aturan "konfirmasi 2 sesi" dan persen lompatan berasal dari praktik coach. Program ini rancangan umum, bukan pengganti pelatih yang melihat langsung tekniknya.</p></div>`}
function vSkip(){return `<h2>🤒 Skip & Sakit — Coach Mode</h2><div class="card"><div class="g"><label class="f">Kondisi<select id="k"><option value="s">Skip biasa (sibuk/malas)</option><option value="a">Sakit ringan di atas leher (pilek, sakit tenggorokan)</option><option value="d">Demam / sakit badan / flu berat / cedera</option></select></label><label class="f">Berapa hari absen?<input id="h" type="number" value="3"></label></div><button style="margin-top:10px" onclick="adv()">Beri saran coach</button><div id="ad" style="margin-top:12px"></div></div>

function adv(){const k=$("#k").value,h=+$("#h").value||0;let a,t;
if(k=="d"){a=h<=3?.95:h<=7?.9:.85;t="🛑 Istirahat total sampai bebas demam minimal 24–48 jam. Jika demam >3 hari, nyeri dada, atau sesak → periksa ke dokter. Setelah pulih: mulai dengan 2 set per latihan, RPE ringan, dan beban turun "+Math.round((1-a)*100)+"% selama 1–2 minggu. Jangan lompati tes PR sebelum minggu 13."}
else if(k=="a"){a=.9;t="🟡 Boleh latihan ringan jika gejala hanya di atas leher dan tidak demam: kurangi 1 set, beban 85–90%, hindari sampai gagal. Kalau terasa lemas atau memburuk, istirahat saja."}
else a=h<=3?1:h<=7?.95:h<=14?.9:h<=28?.85:.75,t=h<=3?"✅ Aman — lanjut sesuai jadwal tanpa perubahan beban.":h<=7?"Turunkan beban 5% di minggu ini, lalu naik normal.":h<=14?"Turunkan 10% dan ulangi minggu terakhir yang kamu jalani (tombol geser jadwal).":h<=28?"Turunkan 15%, ulang 1–2 minggu terakhir.":"Mulai ulang dari fase Fondasi dengan 75% beban agar sendi dan tendon siap lagi.";
$("#ad").innerHTML=`<div class="card" style="background:var(--c2)"><p>${t}</p><button style="margin-top:10px" onclick="S.adj=${a};save();toast('Beban diset ${Math.round(a*100)}%');R()">Terapkan beban ${Math.round(a*100)}%</button></div>`}

function vRec(){const L=[["😴","Tidur 7–9 jam","Otot tumbuh saat istirahat. Tidur <6 jam menurunkan performa dan pemulihan."],["⏱","Istirahat antar set","Compound 2–3 menit, isolasi 60–90 detik. Timer otomatis menyala saat set dicentang."],["📆","Jangan latih otot yang sama <48 jam","Jadwal ini memberi jeda 48–72 jam untuk tiap grup otot utama."],["🔄","Deload tiap minggu ke-4","Minggu 4, 8, 12: volume dikurangi agar sendi pulih dan beban berikutnya lebih kuat."],["🔥","Pemanasan wajib","5 menit kardio, mobilitas bahu, lalu 1–2 set ringan sebelum latihan utama."],["🚩","Sinyal bahaya","Nyeri tajam di sendi, kesemutan, atau teknik rusak → stop, turunkan beban, atau ganti alat."],["💧","Cairan & aktivitas ringan","Minum cukup, jalan kaki 20–30 menit di hari libur untuk bantu pemulihan."]];return `<h2>🛌 Recovery</h2>`+L.map(x=>`<div class="card"><h3>${x[0]} ${x[1]}</h3><p class="m">${x[2]}</p></div>`).join("")+`<p class="m">Rekomendasi umum, bukan saran medis. Konsultasikan ke dokter jika punya riwayat cedera atau penyakit.</p>`}

const T={set:["⚙️","Setup",vSet],lat:["💪","Latihan",vLat],jad:["📅","Jadwal",vJad],pr:["🧠","Coach",vPR],skip:["🤒","Skip/Sakit",vSkip],rec:["🛌","Recovery",vRec]};
$("#nav").innerHTML=Object.entries(T).map(([k,v])=>`<button class="${S.tab==k?"on":""}" onclick="tab('${k}')"><span>${v[0]}</span>${v[1]}</button>`).join("");$("#app").innerHTML=T[S.tab][2]();window.scrollTo(0,0)}
